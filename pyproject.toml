[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MAHR"
version = "0.1.0"
description = "Array-based morphology-agnostic humanoid retargeting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "mujoco>=3.3", "pillow>=10"]

[project.scripts]
mahr = "mahr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
